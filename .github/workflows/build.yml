name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Visual Studio 2022 and the Windows SDK (which has fxc) come with this image.
    runs-on: windows-2022

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # Same dependencies and versions as the README's Building section.
      - name: Fetch ReShade
        run: git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git deps/reshade

      # ReShade passes its own ImGui functions to add-ons, so this commit has to
      # match the one ReShade v6.8.0 pins.
      - name: Fetch ImGui
        run: |
          git clone https://github.com/ocornut/imgui.git deps/imgui
          git -C deps/imgui checkout 3912b3d9a9c1b3f17431aebafd86d2f40ee6e59c

      # Only the headers and libraries of the DLSS SDK are needed.
      - name: Fetch the DLSS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git deps/dlss
          git -C deps/dlss sparse-checkout set include lib/Windows_x86_64/x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Check the output
        run: Get-ChildItem build/Release

      - name: Upload the add-on
        uses: actions/upload-artifact@v4
        with:
          name: acvdlss
          path: build/Release/acvdlss.addon64
          if-no-files-found: error
